<!DOCTYPE html>
<html lang="kk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ислам ерлер дүкені - Премиум Витрина</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background-color: #050505;
            color: #ffffff;
            overflow-x: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .app-container {
            width: 100%;
            max-width: 430px;
            height: 100vh;
            background: #0d0e12;
            position: relative;
            overflow-y: scroll;
            scroll-snap-type: y mandatory;
            scrollbar-width: none;
        }

        .app-container::-webkit-scrollbar {
            display: none;
        }

        .screen {
            width: 100%;
            height: 100vh;
            scroll-snap-align: start;
            scroll-snap-stop: always;
            position: relative;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 40px 25px;
        }

        .welcome-screen {
            background: linear-gradient(180deg, rgba(0,0,0,0.3) 0%, rgba(13,14,18,0.95) 80%), 
                        url('https://images.unsplash.com/photo-1556906781-9a412961c28c?w=600');
            background-size: cover;
            background-position: center;
            justify-content: center;
            align-items: center;
        }

        .welcome-avatar-wrapper {
            position: relative;
            margin-bottom: 30px;
        }

        .welcome-avatar {
            width: 140px;
            height: 140px;
            border-radius: 50%;
            object-fit: cover;
            border: 4px solid #ffffff;
            box-shadow: 0 10px 40px rgba(255,255,255,0.2);
        }

        .welcome-title {
            font-size: 26px;
            font-weight: 800;
            text-align: center;
            line-height: 1.3;
            margin-bottom: 15px;
        }

        .welcome-subtitle {
            font-size: 14px;
            color: #8f92a1;
            text-align: center;
            margin-bottom: 40px;
        }

        .swipe-up-btn {
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ffffff;
            font-size: 13px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 2px;
            cursor: pointer;
        }

        .product-screen {
            background: #0d0e12;
            padding: 30px 20px;
        }

        .card-wrapper {
            width: 100%;
            height: 60%;
            background: #161823;
            border-radius: 30px;
            overflow: hidden;
            position: relative;
            box-shadow: 0 20px 40px rgba(0,0,0,0.5);
            border: 1px solid rgba(255,255,255,0.05);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-image {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .brand-badge {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(0, 0, 0, 0.75);
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            color: #45f3ff;
        }

        .info-block {
            width: 100%;
            margin-top: 15px;
        }

        .product-name {
            font-size: 22px;
            font-weight: 800;
            color: #ffffff;
            margin-bottom: 8px;
            line-height: 1.2;
        }

        .price-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .price-label {
            font-size: 13px;
            color: #8f92a1;
        }

        .product-price {
            font-size: 24px;
            font-weight: 900;
            color: #45f3ff;
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: #ffffff;
            text-decoration: none;
            padding: 16px;
            border-radius: 18px;
            font-size: 16px;
            font-weight: 700;
            box-shadow: 0 10px 25px rgba(37, 211, 102, 0.3);
        }

        .page-counter {
            position: absolute;
            top: 25px;
            right: 25px;
            font-size: 13px;
            font-weight: 700;
            color: rgba(255,255,255,0.5);
            background: rgba(255,255,255,0.08);
            padding: 6px 14px;
            border-radius: 12px;
        }
    </style>
</head>
<body>

    <div class="app-container" id="appScroll">

        <div class="screen welcome-screen">
            <div class="welcome-avatar-wrapper">
                <img class="welcome-avatar" src="https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=200" alt="Ислам">
            </div>
            <h1 class="welcome-title">Ислам ерлер дүкеніне<br>қош келдіңіздер!</h1>
            <p class="welcome-subtitle">Премиум кроссовкалар топтамасы • 2026</p>
            <div class="swipe-up-btn">
                ▲ Төмен сырғытыңыз
            </div>
        </div>

    </div>

    <script>
        const sneakersData = [
            {"name": "Nike Air Force 1 '07", "price": "54 900 ₸", "img": "https://images.unsplash.com/photo-1549298916-b41d501d3772?w=500"},
            {"name": "Adidas Originals Forum Low", "price": "49 900 ₸", "img": "https://images.unsplash.com/photo-1595950653106-6c9ebd614d3a?w=500"},
            {"name": "Nike Air Jordan 1 Retro", "price": "89 900 ₸", "img": "https://images.unsplash.com/photo-1552346154-21d32810aba3?w=500"},
            {"name": "New Balance 530 Metallic", "price": "62 900 ₸", "img": "https://images.unsplash.com/photo-1539185441755-769473a23570?w=500"},
            {"name": "Puma RS-X Efekt", "price": "45 900 ₸", "img": "https://images.unsplash.com/photo-1608231387042-66d1773070a5?w=500"},
            {"name": "Asics GEL-Kayano 14", "price": "74 900 ₸", "img": "https://images.unsplash.com/photo-1560769629-975ec94e6a86?w=500"},
            {"name": "Nike Air Max 90 Black", "price": "69 900 ₸", "img": "https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=500"},
            {"name": "Adidas Yeezy Boost 350 V2", "price": "145 000 ₸", "img": "https://images.unsplash.com/photo-1575537302964-96cd47c06b1b?w=500"},
            {"name": "Reebok Classic Leather", "price": "39 900 ₸", "img": "https://images.unsplash.com/photo-1500462969106-f0699e77328e?w=500"},
            {"name": "Nike Dunk Low Panda", "price": "72 900 ₸", "img": "https://images.unsplash.com/photo-1600185365483-26d7a4cc7519?w=500"},
            {"name": "New Balance 2002R Protection", "price": "85 900 ₸", "img": "https://images.unsplash.com/photo-1606107557195-0e29a4b5b4aa?w=500"},
            {"name": "Vans Old Skool Classic", "price": "32 900 ₸", "img": "https://images.unsplash.com/photo-1525966222134-fcfa99b8ae77?w=500"},
            {"name": "Converse Chuck Taylor 70", "price": "37 900 ₸", "img": "https://images.unsplash.com/photo-1597045566677-8cf032ed6634?w=500"},
            {"name": "Under Armour Hover Phantom", "price": "58 900 ₸", "img": "https://images.unsplash.com/photo-1514989940723-e8e5163ccbe8?w=500"},
            {"name": "Nike Air Max Plus TN", "price": "82 900 ₸", "img": "https://images.unsplash.com/photo-1512374382149-4332c6c02151?w=500"},
            {"name": "Adidas Ultraboost Light", "price": "95 900 ₸", "img": "https://images.unsplash.com/photo-1587563871167-1ee9c271a014?w=500"},
            {"name": "Salomon XT-6 Advanced", "price": "110 000 ₸", "img": "https://images.unsplash.com/photo-1491553895911-0055eca6402d?w=500"},
            {"name": "Nike Air Zoom Pegasus 40", "price": "64 900 ₸", "img": "https://images.unsplash.com/photo-1605348532760-6753d2c43329?w=500"},
            {"name": "Puma Suede Classic", "price": "35 900 ₸", "img": "https://images.unsplash.com/photo-1556906781-9a412961c28c?w=500"},
            {"name": "Jordan 4 Retro Military Black", "price": "165 000 ₸", "img": "https://images.unsplash.com/photo-1543163521-1bf539c55dd2?w=500"}
        ];

        const scrollContainer = document.getElementById('appScroll');
        const whatsappBaseUrl = "https://wa.me/qr/EHOTMVYXSRPGD1";

        sneakersData.forEach((item, index) => {
            const message = encodeURIComponent("Сәлеметсіз бе! Ислам ерлер дүкенінен мына модельді көрдім: " + item.name + " - " + item.price + ". Тапсырыс бергім келеді!");
            const finalWaLink = whatsappBaseUrl + "?text=" + message;

            const screenHtml = `
                <div class="screen product-screen">
                    <div class="page-counter">${index + 1} / 20</div>
                    <div class="card-wrapper">
                        <span class="brand-badge">PREMIUM</span>
                        <img class="product-image" src="${item.img}" alt="${item.name}">
                    </div>
                    <div class="info-block">
                        <h2 class="product-name">${item.name}</h2>
                        <div class="price-row">
                            <span class="price-label">Бағасы:</span>
                            <span class="product-price">${item.price}</span>
                        </div>
                        <a href="${finalWaLink}" target="_blank" class="btn-whatsapp">
                            WhatsApp арқылы тапсырыс беру
                        </a>
                    </div>
                </div>
            `;
            scrollContainer.innerHTML += screenHtml;
        });
    </script>
</body>
</html>
